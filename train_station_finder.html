<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearest Train Station Finder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.1em;
            cursor: pointer;
            width: 100%;
            margin-bottom: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .status.loading {
            background: #e3f2fd;
            color: #1976d2;
            display: block;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
            display: block;
        }

        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
            display: block;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .location-info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .location-info.show {
            display: block;
        }

        .location-info h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .location-info p {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .stations-list {
            margin-top: 20px;
        }

        .station-card {
            background: #fafafa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .station-card:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .station-card.nearest {
            border-left-color: #43a047;
            background: linear-gradient(135deg, #e8f5e9 0%, #f1f8f4 100%);
        }

        .station-name {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .station-card.nearest .station-name::before {
            content: "🏆 ";
        }

        .station-distance {
            color: #667eea;
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 8px;
        }

        .station-details {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .station-link {
            display: inline-block;
            margin-top: 10px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .station-link:hover {
            color: #764ba2;
        }

        .no-stations {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .icon {
            font-size: 1.3em;
            margin-right: 8px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 1.5em;
            }

            .btn {
                font-size: 1em;
                padding: 12px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚂 Train Station Finder</h1>
        <p class="subtitle">Find the nearest train station to your current location</p>

        <button id="findBtn" class="btn">
            <span class="icon">📍</span>Find Nearest Station
        </button>

        <div id="status" class="status"></div>

        <div id="locationInfo" class="location-info"></div>

        <div id="stationsList" class="stations-list"></div>
    </div>

    <script>
        const findBtn = document.getElementById('findBtn');
        const statusDiv = document.getElementById('status');
        const locationInfo = document.getElementById('locationInfo');
        const stationsList = document.getElementById('stationsList');

        findBtn.addEventListener('click', findNearestStation);

        async function findNearestStation() {
            // Reset UI
            statusDiv.className = 'status loading';
            statusDiv.innerHTML = '<div class="loader"></div>Getting your location...';
            locationInfo.classList.remove('show');
            stationsList.innerHTML = '';
            findBtn.disabled = true;

            try {
                // Get user's location
                const position = await getCurrentPosition();
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                // Show location info
                showLocationInfo(lat, lon);

                // Update status
                statusDiv.innerHTML = '<div class="loader"></div>Searching for nearby train stations...';

                // Search for train stations
                const stations = await searchTrainStations(lat, lon);

                if (stations.length === 0) {
                    statusDiv.className = 'status error';
                    statusDiv.textContent = 'No train stations found within 10km of your location.';
                    stationsList.innerHTML = '<div class="no-stations">Try moving to a different area or the search radius might need adjustment.</div>';
                } else {
                    statusDiv.className = 'status success';
                    statusDiv.textContent = `Found ${stations.length} train station${stations.length > 1 ? 's' : ''} nearby!`;
                    displayStations(stations, lat, lon);
                }
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.textContent = `Error: ${error.message}`;
            } finally {
                findBtn.disabled = false;
            }
        }

        function getCurrentPosition() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error('Geolocation is not supported by your browser'));
                    return;
                }

                navigator.geolocation.getCurrentPosition(resolve, (error) => {
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            reject(new Error('Location permission denied. Please enable location access.'));
                            break;
                        case error.POSITION_UNAVAILABLE:
                            reject(new Error('Location information unavailable.'));
                            break;
                        case error.TIMEOUT:
                            reject(new Error('Location request timed out.'));
                            break;
                        default:
                            reject(new Error('An unknown error occurred.'));
                    }
                }, {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                });
            });
        }

        function showLocationInfo(lat, lon) {
            locationInfo.innerHTML = `
                <h3>📍 Your Location</h3>
                <p><strong>Latitude:</strong> ${lat.toFixed(6)}°</p>
                <p><strong>Longitude:</strong> ${lon.toFixed(6)}°</p>
            `;
            locationInfo.classList.add('show');
        }

        async function searchTrainStations(lat, lon) {
            // Using Overpass API to query OpenStreetMap for railway stations
            const radius = 10000; // 10km radius
            const query = `
                [out:json][timeout:25];
                (
                    node["railway"="station"](around:${radius},${lat},${lon});
                    node["railway"="halt"](around:${radius},${lat},${lon});
                    way["railway"="station"](around:${radius},${lat},${lon});
                );
                out body;
                >;
                out skel qt;
            `;

            const url = 'https://overpass-api.de/api/interpreter';

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    body: query
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch train stations');
                }

                const data = await response.json();

                // Process and sort stations by distance
                const stations = data.elements
                    .filter(element => element.tags && element.tags.name)
                    .map(element => {
                        const stationLat = element.lat || element.center?.lat;
                        const stationLon = element.lon || element.center?.lon;

                        if (!stationLat || !stationLon) return null;

                        return {
                            name: element.tags.name,
                            lat: stationLat,
                            lon: stationLon,
                            distance: calculateDistance(lat, lon, stationLat, stationLon),
                            operator: element.tags.operator || 'Unknown',
                            network: element.tags.network || '',
                            type: element.tags.railway
                        };
                    })
                    .filter(station => station !== null)
                    .sort((a, b) => a.distance - b.distance)
                    .slice(0, 10); // Show top 10 nearest stations

                return stations;
            } catch (error) {
                throw new Error(`Failed to search for stations: ${error.message}`);
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            // Haversine formula for calculating distance between two points
            const R = 6371; // Earth's radius in km
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                     Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                     Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function toRad(degrees) {
            return degrees * (Math.PI / 180);
        }

        function displayStations(stations, userLat, userLon) {
            stationsList.innerHTML = stations.map((station, index) => {
                const isNearest = index === 0;
                const distanceText = station.distance < 1
                    ? `${Math.round(station.distance * 1000)}m`
                    : `${station.distance.toFixed(2)}km`;

                const mapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${userLat},${userLon}&destination=${station.lat},${station.lon}&travelmode=walking`;

                return `
                    <div class="station-card ${isNearest ? 'nearest' : ''}">
                        <div class="station-name">${station.name}</div>
                        <div class="station-distance">📏 ${distanceText} away</div>
                        ${station.operator !== 'Unknown' ? `<div class="station-details">🚉 Operator: ${station.operator}</div>` : ''}
                        ${station.network ? `<div class="station-details">🔗 Network: ${station.network}</div>` : ''}
                        <div class="station-details">📍 ${station.lat.toFixed(6)}°, ${station.lon.toFixed(6)}°</div>
                        <a href="${mapsUrl}" target="_blank" class="station-link">🗺️ Get Directions</a>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
